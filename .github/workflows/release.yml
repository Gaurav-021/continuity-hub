name: Release & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux-daemon:
    name: Build Linux x86_64 Daemon Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies & Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: Build Release Binary
        run: cargo build --release -p continuity-daemon

      - name: Strip Debug Symbols
        run: strip target/release/continuity-daemon

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="continuity-daemon") | .version')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package Linux Distribution Tarball
        run: |
          VERSION="${{ steps.vars.outputs.tag }}"
          PACKAGE_DIR="continuity-daemon-${VERSION}-linux-x86_64"
          mkdir -p "$PACKAGE_DIR/bin" "$PACKAGE_DIR/scripts" "$PACKAGE_DIR/assets"

          cp target/release/continuity-daemon "$PACKAGE_DIR/bin/"
          cp scripts/install-linux-app.sh "$PACKAGE_DIR/install.sh"
          cp scripts/setup-v4l2loopback.sh "$PACKAGE_DIR/scripts/"
          cp assets/* "$PACKAGE_DIR/assets/"
          cp README.md "$PACKAGE_DIR/"
          chmod +x "$PACKAGE_DIR/install.sh" "$PACKAGE_DIR/bin/continuity-daemon" "$PACKAGE_DIR/scripts/setup-v4l2loopback.sh"

          tar -czvf "${PACKAGE_DIR}.tar.gz" "$PACKAGE_DIR"

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-daemon-tarball
          path: continuity-daemon-*-linux-x86_64.tar.gz

  build-windows-daemon:
    name: Build Windows x86_64 Daemon Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/actions-setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies & Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: Build Release Binary
        run: cargo build --release -p continuity-daemon

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="continuity-daemon") | .version')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package Windows Distribution Zip
        shell: pwsh
        run: |
          $Version = "${{ steps.vars.outputs.tag }}"
          $PackageDir = "continuity-daemon-$Version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$PackageDir"
          Copy-Item "target/release/continuity-daemon.exe" -Destination "$PackageDir/"
          Copy-Item "README.md" -Destination "$PackageDir/"
          Copy-Item "WINDOWS.md" -Destination "$PackageDir/"
          Compress-Archive -Path "$PackageDir/*" -DestinationPath "$PackageDir.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-daemon-zip
          path: continuity-daemon-*-windows-x86_64.zip

  build-android-apk:
    name: Build Android Client Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x client-android/gradlew

      - name: Run Unit Tests
        run: cd client-android && ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: cd client-android && ./gradlew assembleRelease --stacktrace

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Stage Release APK
        run: |
          VERSION="${{ steps.vars.outputs.tag }}"
          cp client-android/app/build/outputs/apk/release/app-release.apk "continuity-hub-${VERSION}.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: continuity-hub-*.apk

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-daemon, build-windows-daemon, build-android-apk]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-daemon-tarball
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-daemon-zip
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-assets

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Continuity Hub ${{ steps.vars.outputs.tag }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
