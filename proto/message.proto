syntax = "proto3";

package continuity;

option java_package = "com.continuityhub.proto";
option java_multiple_files = true;

enum Channel {
    CHANNEL_UNKNOWN = 0;
    CHANNEL_HANDSHAKE = 1;
    CHANNEL_CLIPBOARD = 2;
    CHANNEL_FILE_TRANSFER = 3;
    CHANNEL_NOTIFICATIONS = 4;
    CHANNEL_HEARTBEAT = 5;
    CHANNEL_INPUT = 6;
    CHANNEL_TELEPHONY = 7;
    CHANNEL_MEDIA = 8;
    CHANNEL_CAMERA = 9;
}

message Packet {
    string session_id = 1;
    uint64 sequence_number = 2;
    Channel channel = 3;
    bytes payload = 4;
}

message HandshakeRequest {
    string device_name = 1;
    string device_id = 2;
    string cert_fingerprint = 3;
    uint32 protocol_version = 4;
}

message HandshakeResponse {
    enum Status {
        STATUS_UNKNOWN = 0;
        STATUS_ACCEPTED = 1;
        STATUS_REJECTED = 2;
        STATUS_AUTH_PENDING = 3;
    }
    Status status = 1;
    string device_name = 2;
    string device_id = 3;
    string cert_fingerprint = 4;
    string message = 5;
}

message ClipboardPayload {
    uint64 timestamp_ms = 1;
    string mime_type = 2;
    bytes data = 3;
    string content_hash = 4;
    string source_device_id = 5;
}

// File Transfer Messages
message FileTransferHeader {
    string transfer_id = 1;
    string file_name = 2;
    uint64 file_size = 3;
    string mime_type = 4;
    uint64 total_chunks = 5;
    uint32 chunk_size = 6;
    string sha256_checksum = 7;
    string source_device_id = 8;
}

message FileChunk {
    string transfer_id = 1;
    uint64 chunk_index = 2;
    uint64 offset = 3;
    bytes data = 4;
    bool is_last_chunk = 5;
    string chunk_hash = 6;
}

message FileTransferAck {
    enum Status {
        STATUS_UNKNOWN = 0;
        STATUS_ACCEPTED = 1;
        STATUS_REJECTED = 2;
        STATUS_IN_PROGRESS = 3;
        STATUS_COMPLETED = 4;
        STATUS_CANCELLED = 5;
        STATUS_CHECKSUM_FAILED = 6;
    }
    string transfer_id = 1;
    Status status = 2;
    uint64 last_received_chunk = 3;
    string message = 4;
}

message FileTransferMessage {
    oneof msg {
        FileTransferHeader header = 1;
        FileChunk chunk = 2;
        FileTransferAck ack = 3;
    }
}

// Notification Mirroring Messages
message NotificationAction {
    string action_id = 1;
    string label = 2;
    bool is_quick_reply = 3;
}

message NotificationPayload {
    string notification_id = 1;
    string package_name = 2;
    string app_name = 3;
    string title = 4;
    string body = 5;
    uint64 timestamp_ms = 6;
    bytes icon_data = 7;
    string category = 8;
    bool has_quick_reply = 9;
    repeated NotificationAction actions = 10;
    string source_device_id = 11;
}

message NotificationDismiss {
    string notification_id = 1;
    string source_device_id = 2;
}

message NotificationActionRequest {
    enum ActionType {
        ACTION_UNKNOWN = 0;
        ACTION_DISMISS = 1;
        ACTION_REPLY = 2;
        ACTION_CLICK = 3;
    }
    string notification_id = 1;
    string action_id = 2;
    ActionType action_type = 3;
    string reply_text = 4;
    string source_device_id = 5;
}

message NotificationMessage {
    oneof msg {
        NotificationPayload post = 1;
        NotificationDismiss dismiss = 2;
        NotificationActionRequest action = 3;
    }
}

message Heartbeat {
    uint64 timestamp_ms = 1;
}

// Remote Input Messages (Trackpad & Keyboard)
message MouseMoveEvent {
    float dx = 1;
    float dy = 2;
}

message MouseButtonEvent {
    enum Button {
        BUTTON_UNKNOWN = 0;
        BUTTON_LEFT = 1;
        BUTTON_RIGHT = 2;
        BUTTON_MIDDLE = 3;
    }
    enum State {
        STATE_UNKNOWN = 0;
        STATE_PRESS = 1;
        STATE_RELEASE = 2;
        STATE_CLICK = 3;
    }
    Button button = 1;
    State state = 2;
}

message MouseScrollEvent {
    float dx = 1;
    float dy = 2;
}

message KeyEvent {
    enum KeyState {
        KEY_STATE_UNKNOWN = 0;
        KEY_PRESS = 1;
        KEY_RELEASE = 2;
        KEY_CLICK = 3;
    }
    string key_name = 1;
    string text = 2;
    KeyState state = 3;
    repeated string modifiers = 4;
}

message InputMessage {
    oneof event {
        MouseMoveEvent mouse_move = 1;
        MouseButtonEvent mouse_button = 2;
        MouseScrollEvent mouse_scroll = 3;
        KeyEvent key_event = 4;
    }
}

// Telephony, Call & SMS Continuity
message CallEvent {
    enum CallState {
        CALL_STATE_UNKNOWN = 0;
        CALL_STATE_RINGING = 1;
        CALL_STATE_OFFHOOK = 2; // In call
        CALL_STATE_IDLE = 3;    // Call ended / dismissed
        CALL_STATE_MISSED = 4;
    }
    string call_id = 1;
    string phone_number = 2;
    string contact_name = 3;
    CallState state = 4;
    uint64 timestamp_ms = 5;
}

message CallActionRequest {
    enum Action {
        ACTION_UNKNOWN = 0;
        ACTION_MUTE = 1;
        ACTION_REJECT = 2;
        ACTION_REJECT_WITH_SMS = 3;
    }
    string call_id = 1;
    Action action = 2;
    string sms_reply = 3;
    string phone_number = 4;
}

message SmsMessage {
    string message_id = 1;
    string phone_number = 2;
    string contact_name = 3;
    string body = 4;
    uint64 timestamp_ms = 5;
    bool is_incoming = 6;
}

message SendSmsRequest {
    string request_id = 1;
    string phone_number = 2;
    string body = 3;
}

message SendSmsResponse {
    string request_id = 1;
    bool success = 2;
    string error_message = 3;
}

// Device Health & Network Telemetry
message DeviceTelemetry {
    enum ChargingType {
        CHARGING_NONE = 0;
        CHARGING_AC = 1;
        CHARGING_USB = 2;
        CHARGING_WIRELESS = 3;
        CHARGING_FAST = 4;
    }
    enum NetworkType {
        NETWORK_UNKNOWN = 0;
        NETWORK_NONE = 1;
        NETWORK_WIFI = 2;
        NETWORK_CELLULAR_4G = 3;
        NETWORK_CELLULAR_5G = 4;
        NETWORK_ETHERNET = 5;
    }
    uint32 battery_percentage = 1;
    bool is_charging = 2;
    ChargingType charging_type = 3;
    float battery_temperature_c = 4;
    NetworkType network_type = 5;
    string wifi_ssid = 6;
    string cellular_carrier = 7;
    uint32 signal_bars = 8;
    uint64 timestamp_ms = 9;
}

message TelephonyMessage {
    oneof msg {
        CallEvent call_event = 1;
        CallActionRequest call_action = 2;
        SmsMessage sms_message = 3;
        SendSmsRequest send_sms = 4;
        SendSmsResponse send_sms_resp = 5;
        DeviceTelemetry telemetry = 6;
    }
}

// Multimedia Sync & Remote Media Control (MPRIS <-> Android MediaSession)
message MediaPlaybackState {
    enum State {
        STATE_UNKNOWN = 0;
        STATE_STOPPED = 1;
        STATE_PLAYING = 2;
        STATE_PAUSED = 3;
    }
    State state = 1;
    int64 position_ms = 2;
    float playback_speed = 3;
    bool can_play = 4;
    bool can_pause = 5;
    bool can_skip_next = 6;
    bool can_skip_previous = 7;
    bool can_seek = 8;
    uint64 update_time_ms = 9;
}

message MediaMetadata {
    string track_id = 1;
    string title = 2;
    string artist = 3;
    string album = 4;
    int64 duration_ms = 5;
    bytes art_bytes = 6;
    string player_name = 7;
}

message MediaControlCommand {
    enum Command {
        COMMAND_UNKNOWN = 0;
        COMMAND_PLAY = 1;
        COMMAND_PAUSE = 2;
        COMMAND_PLAY_PAUSE = 3;
        COMMAND_NEXT = 4;
        COMMAND_PREVIOUS = 5;
        COMMAND_STOP = 6;
        COMMAND_SEEK = 7;
        COMMAND_SET_VOLUME = 8;
    }
    Command command = 1;
    int64 seek_position_ms = 2;
    float volume = 3;
    string target_player = 4;
}

message MediaMessage {
    oneof msg {
        MediaPlaybackState playback_state = 1;
        MediaMetadata metadata = 2;
        MediaControlCommand control = 3;
    }
}

// Continuity Camera, Virtual Webcam & Desktop Screencast
message CameraConfig {
    enum Lens {
        LENS_BACK = 0;
        LENS_FRONT = 1;
        LENS_WIDE = 2;
    }
    enum VideoFormat {
        FORMAT_MJPEG = 0;
        FORMAT_H264 = 1;
    }
    uint32 width = 1;
    uint32 height = 2;
    uint32 target_fps = 3;
    Lens lens = 4;
    VideoFormat format = 5;
    bool torch_enabled = 6;
    float zoom_ratio = 7;
    uint32 rotation_degrees = 8;
}

message CameraControlCommand {
    enum Action {
        ACTION_UNKNOWN = 0;
        ACTION_START = 1;
        ACTION_STOP = 2;
        ACTION_SWITCH_LENS = 3;
        ACTION_TOGGLE_TORCH = 4;
        ACTION_SET_ZOOM = 5;
        ACTION_TAKE_SNAPSHOT = 6;
        ACTION_REQUEST_DESKTOP_SCREEN = 7;
        ACTION_START_DESKTOP_STREAM = 8;
        ACTION_STOP_DESKTOP_STREAM = 9;
        ACTION_SET_ROTATION = 10;
        ACTION_START_SIDECAR = 11;
        ACTION_STOP_SIDECAR = 12;
        ACTION_SIDECAR_CLICK = 13;
    }
    Action action = 1;
    CameraConfig.Lens lens = 2;
    bool torch = 3;
    float zoom_ratio = 4;
    uint32 width = 5;
    uint32 height = 6;
    uint32 rotation_degrees = 7;
    float touch_x = 8;
    float touch_y = 9;
}

message CameraFrame {
    uint64 frame_index = 1;
    uint64 timestamp_us = 2;
    uint32 width = 3;
    uint32 height = 4;
    bytes frame_data = 5;
    bool is_keyframe = 6;
}

message CameraSnapshot {
    string snapshot_id = 1;
    uint64 timestamp_ms = 2;
    bytes image_bytes = 3;
    uint32 width = 4;
    uint32 height = 5;
}

message DesktopScreenFrame {
    uint64 timestamp_ms = 1;
    uint32 width = 2;
    uint32 height = 3;
    bytes image_bytes = 4;
    bool is_sidecar = 5;
    string monitor_name = 6;
}

message CameraMessage {
    oneof msg {
        CameraConfig config = 1;
        CameraControlCommand control = 2;
        CameraFrame frame = 3;
        CameraSnapshot snapshot = 4;
        DesktopScreenFrame desktop_screen = 5;
    }
}




