syntax = "proto3";

package continuity;

option java_package = "com.continuityhub.proto";
option java_multiple_files = true;

enum Channel {
    CHANNEL_UNKNOWN = 0;
    CHANNEL_HANDSHAKE = 1;
    CHANNEL_CLIPBOARD = 2;
    CHANNEL_HEARTBEAT = 3;
}

message Packet {
    string session_id = 1;
    uint64 sequence_number = 2;
    Channel channel = 3;
    bytes payload = 4;
}

message HandshakeRequest {
    string device_name = 1;
    string device_id = 2;
    string cert_fingerprint = 3;
    uint32 protocol_version = 4;
}

message HandshakeResponse {
    enum Status {
        STATUS_UNKNOWN = 0;
        STATUS_ACCEPTED = 1;
        STATUS_REJECTED = 2;
        STATUS_AUTH_PENDING = 3;
    }
    Status status = 1;
    string device_name = 2;
    string device_id = 3;
    string cert_fingerprint = 4;
    string message = 5;
}

message ClipboardPayload {
    uint64 timestamp_ms = 1;
    string mime_type = 2;
    bytes data = 3;
    string content_hash = 4;
    string source_device_id = 5;
}

message Heartbeat {
    uint64 timestamp_ms = 1;
}
