<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle glow aura -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Laptop / Desktop Base -->
  <path d="M 120 340 L 392 340 L 416 358 L 96 358 Z" fill="#475569" opacity="0.8"/>
  <rect x="144" y="180" width="224" height="150" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <rect x="156" y="192" width="200" height="126" rx="6" fill="#090d16"/>

  <!-- Phone (overlapping continuity element) -->
  <g filter="url(#glow)">
    <rect x="290" y="210" width="100" height="180" rx="20" fill="#0f172a" stroke="url(#phoneGrad)" stroke-width="6"/>
    <rect x="300" y="224" width="80" height="152" rx="12" fill="#111827"/>
    <circle cx="340" cy="220" r="3" fill="#64748b"/>
    <!-- Phone Screen Indicator -->
    <rect x="325" y="364" width="30" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Continuity Bridge Infinity Wave -->
  <path d="M 180 255 C 220 205, 260 305, 300 255 C 320 230, 340 240, 340 255"
        fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Sync Pulse Rings -->
  <circle cx="240" cy="255" r="12" fill="#38bdf8" opacity="0.9"/>
  <circle cx="240" cy="255" r="24" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5"/>
</svg>
