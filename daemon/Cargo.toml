[package]
name = "continuity-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Continuity Team"]
description = "High-performance, low-latency cross-platform continuity daemon for Linux Wayland"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
rustls-pki-types = "1.10"
rcgen = "0.13"
mdns-sd = "0.13"
prost = "0.13"
bytes = "1.10"
sha2 = "0.10"
hex = "0.4"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.13", features = ["v4", "fast-rng"] }
async-trait = "0.1"
thiserror = "2.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
zbus = "5.19"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }


[build-dependencies]
prost-build = "0.13"
